	<script type="text/javascript">
		var forgetPop = true;
		function onPopState(event) {
			if(forgetPop){
				forgetPop = false;
			} else {
				parent.postMessage(event.target.location.href, "app://obsidian.md");
			}
        }
		window.onpopstate = onPopState;
		window.onmessage = event => {
			if(event.data == "reload"){
				window.document.location.reload();
			}
			forgetPop = true;
		}

		function fitElements(){
			const itemsToFit = document.getElementsByClassName('fitText');
			for (const item in itemsToFit) {
				if (Object.hasOwnProperty.call(itemsToFit, item)) {
					var element = itemsToFit[item];
					fitElement(element,1, 1000);
					element.classList.remove('fitText');
				}
			}
		}

		function fitElement(element, start, end){

			let size = (end + start) / 2;
			element.style.fontSize = `${size}px`;

			if(Math.abs(start - end) < 1){
				while(element.scrollHeight > element.offsetHeight){
					size--;
					element.style.fontSize = `${size}px`;
				}
				return;
			}

			if(element.scrollHeight > element.offsetHeight){
				fitElement(element, start, size);
			} else {
				fitElement(element, size, end);
			}		
		}


		document.onreadystatechange = () => {
			fitElements();
			if (document.readyState === 'complete') {
				if (window.location.href.indexOf("?export") != -1){
					parent.postMessage(event.target.location.href, "app://obsidian.md");
				}
				if (window.location.href.indexOf("print-pdf") != -1){
					let stateCheck = setInterval(() => {
						clearInterval(stateCheck);
						window.print();
					}, 250);
				}
			}
	};


        </script>

<div class="card" style="padding: 0 26px; box-sizing: border-box; position: absolute; left: 4%; top: 21%; height: 70%; width: 44%; display: flex; flex-direction: column; align-items: start; justify-content: space-evenly" align="left">


### 🏗️ Build time

- 🔁 **Reproducible builds** — verify what you ship <!-- .element: class="fragment" -->
- 🧾 **Full dependency graph** — SBOMs come almost for free <!-- .element: class="fragment" -->
- 🔍 **Every change reviewed** — infra changes are PRs <!-- .element: class="fragment" -->
- 🧊 **Minimal surface** — only what you declare is installed <!-- .element: class="fragment" -->

</div>

<div class="card" style="padding: 0 26px; box-sizing: border-box; position: absolute; left: 52%; top: 21%; height: 70%; width: 44%; display: flex; flex-direction: column; align-items: start; justify-content: space-evenly" align="left">


### 🛰️ Run time

- 🗝️ **Secrets** via `sops-nix` or `agenix` <!-- .element: class="fragment" -->
- 🛡️ **Hardening** modules & systemd sandboxing <!-- .element: class="fragment" -->
- ⏪ **Fast recovery** — rollback after a bad patch <!-- .element: class="fragment" -->
- 🌬️ **Impermanence** — wipe root on every boot <!-- .element: class="fragment" -->

</div>
</div>

<aside class="notes"><p>Tie back to GitOps: the Git repo IS the source of truth, and drift is structurally impossible for anything Nix manages.</p>

<div class="crumb" style="position: absolute; left: 56%; top: 1%; height: 6%; width: 40%; display: flex; flex-direction: column; align-items: start; justify-content: space-evenly" align="right">

</div>

<div class="compare fadeIn" style="position: absolute; left: 4%; top: 22%; height: 68%; width: 92%; display: flex; flex-direction: column; align-items: start; justify-content: center" >


| | Traditional distro | Ansible | Docker | Kubernetes | NixOS |
|---|:-:|:-:|:-:|:-:|:-:|
| Declarative | ❌ | 🟡 | 🟡 | ✅ | ✅ |
| Reproducible | ❌ | 🟡 | 🟡 | 🟡 | ✅ |
| Atomic rollback | ❌ | ❌ | ✅ | 🟡 | ✅ |
| Whole-OS scope | ✅ | ✅ | ❌ | ❌ | ✅ |
| Easy to learn | ✅ | ✅ | ✅ | ❌ | ❌ |

</div>
</div>

<aside class="notes"><p>Kubernetes is declarative, but reproducibility depends on pinning images by digest, and <code>kubectl rollout undo</code> only rolls back single workloads, not the whole cluster. It doesn&#39;t manage the node OS at all. NixOS and Kubernetes complement each other: NixOS for the nodes, Kubernetes for the workloads.</p>
</aside></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
